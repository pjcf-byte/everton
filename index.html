<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton FC Home Fixture Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #003399; /* Everton Royal Blue */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1px solid rgba(229, 231, 235, 0.8);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: rgba(0, 51, 153, 0.08);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: 700;
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .status-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1><i class="fa-solid fa-house"></i> Everton FC Dashboard</h1>
            <p>Next Home Premier League Fixture</p>
        </header>

        <main class="grid-container">
            <!-- Card 1: Opponent -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Opponent</span>
                    <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                </div>
                <div class="card-value" id="val-opponent">vs Ipswich Town</div>
            </div>

            <!-- Card 2: Date -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Fixture Date</span>
                    <div class="card-icon"><i class="fa-regular fa-calendar-days"></i></div>
                </div>
                <div class="card-value" id="val-date">19 Sep 2026</div>
            </div>

            <!-- Card 3: On Sale Info -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">On Sale</span>
                    <div class="card-icon"><i class="fa-solid fa-ticket"></i></div>
                </div>
                <div class="card-value" id="val-onsale">Check EvertonFC.com</div>
            </div>
        </main>

        <div class="status-footer">
            <span class="status-indicator" id="status-dot"></span>
            <span id="status-text">Next Home Fixture Loaded</span>
        </div>
    </div>

    <script>
        const API_URL = 'https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=133615';

        async function updateDashboard() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) return;

                const data = await response.json();
                if (!data.events || data.events.length === 0) return;

                // Find the next home fixture
                const nextHomeMatch = data.events.find(event => 
                    event.strHomeTeam && event.strHomeTeam.toLowerCase().includes('everton')
                );

                if (nextHomeMatch) {
                    document.getElementById('val-opponent').textContent = `vs ${nextHomeMatch.strAwayTeam}`;
                    
                    if (nextHomeMatch.dateEvent) {
                        const dateObj = new Date(nextHomeMatch.dateEvent);
                        document.getElementById('val-date').textContent = dateObj.toLocaleDateString('en-GB', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric'
                        });
                    }
                }
            } catch (e) {
                // Keep default static content if dynamic fetching fails due to browser CORS rules
            }
        }

        document.addEventListener('DOMContentLoaded', updateDashboard);
    </script>
</body>
</html>
