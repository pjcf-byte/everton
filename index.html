<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton FC Home Fixture Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Theme Variables */
        :root {
            --primary-color: #003399; /* Everton Royal Blue */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: rgba(229, 231, 235, 0.8);
            --icon-bg: rgba(0, 51, 153, 0.08);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --toggle-bg: #e5e7eb;
            --table-header-bg: #003399;
            --table-header-text: #ffffff;
            --table-row-alt: #f8fafc;
            --badge-win-bg: #dcfce7;
            --badge-win-text: #166534;
            --badge-draw-bg: #fef9c3;
            --badge-draw-text: #854d0e;
            --badge-loss-bg: #fee2e2;
            --badge-loss-text: #991b1b;
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --icon-bg: rgba(59, 130, 246, 0.15);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --toggle-bg: #334155;
            --table-header-bg: #1e3a8a;
            --table-header-text: #ffffff;
            --table-row-alt: #0f172a;
            --badge-win-bg: #064e3b;
            --badge-win-text: #a7f3d0;
            --badge-draw-bg: #713f12;
            --badge-draw-text: #fef08a;
            --badge-loss-bg: #7f1d1d;
            --badge-loss-text: #fecaca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            text-align: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 950px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 28px;
            text-align: center;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--toggle-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .theme-toggle-btn:hover {
            opacity: 0.9;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            text-align: center;
        }

        [data-theme="dark"] header h1 {
            color: #3b82f6;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
            text-align: center;
        }

        .section-header {
            margin-bottom: 12px;
            text-align: center;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-color);
        }

        [data-theme="dark"] .card::before {
            background-color: #3b82f6;
        }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
            text-align: center;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--icon-bg);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="dark"] .card-icon {
            color: #3b82f6;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: 700;
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        /* Table Styles */
        .table-section {
            margin-top: 36px;
        }

        .table-wrapper {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            text-align: left;
        }

        th {
            background-color: var(--table-header-bg);
            color: var(--table-header-text);
            padding: 12px 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        tbody tr:nth-child(even) {
            background-color: var(--table-row-alt);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            text-align: center;
        }

        .badge-win {
            background-color: var(--badge-win-bg);
            color: var(--badge-win-text);
        }

        .badge-draw {
            background-color: var(--badge-draw-bg);
            color: var(--badge-draw-text);
        }

        .badge-loss {
            background-color: var(--badge-loss-bg);
            color: var(--badge-loss-text);
        }

        .badge-pending {
            background-color: var(--toggle-bg);
            color: var(--text-muted);
        }

        .venue-tag {
            font-weight: 600;
            color: var(--primary-color);
        }

        [data-theme="dark"] .venue-tag {
            color: #3b82f6;
        }

        .ticket-holder-cell {
            font-weight: 600;
            color: var(--text-main);
        }

        .status-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
                        <h1><i class="fa-solid fa-house"></i> Everton FC Dashboard</h1>
            <p>Next Home Premier League Fixture</p>
        </header>

        <main>
            <div class="section-header">
                <h2>Next Match Overview</h2>
            </div>

            <div class="grid-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                        <span class="card-title">Opponent</span>
                    </div>
                    <div class="card-value" id="val-opponent">vs Ipswich Town</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-regular fa-calendar-days"></i></div>
                        <span class="card-title">Fixture Date</span>
                    </div>
                    <div class="card-value" id="val-date">19 Sep 2026</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-solid fa-ticket"></i></div>
                        <span class="card-title">Ticket Holder</span>
                    </div>
                    <div class="card-value" id="val-holder">Loading...</div>
                </div>
            </div>

            <!-- Table Section -->
            <section class="table-section">
                <div class="section-header">
                    <h2>2026/27 Season Fixtures & Results</h2>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Opponent</th>
                                <th>H/A</th>
                                <th>Score / Time</th>
                                <th>Result</th>
                                <th>Ticket Holder</th>
                            </tr>
                        </thead>
                        <tbody id="season-fixtures-body">
                            <!-- Filled dynamically by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <div class="status-footer">
            <span class="status-indicator"></span>
            <span id="status-text">Next Home Fixture & Ticket Holders Loaded</span>
        </div>
    </div>

    <script>
        // --- Theme Switch Handler ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Light';
            } else {
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Dark';
            }
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme) {
            setTheme(savedTheme);
        } else if (systemPrefersDark) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // --- 2026/27 Season Schedule Data ---
        const seasonFixtures2627 = [
            { date: "22 Aug 2026", opponent: "Crystal Palace", venue: "H", score: "2 - 0", result: "W" },
            { date: "29 Aug 2026", opponent: "AFC Bournemouth", venue: "A", score: "1 - 1", result: "D" },
            { date: "06 Sep 2026", opponent: "Manchester United", venue: "H", score: "2 - 2", result: "D" },
            { date: "12 Sep 2026", opponent: "Tottenham Hotspur", venue: "A", score: "17:30", result: "-" },
            { date: "19 Sep 2026", opponent: "Ipswich Town", venue: "H", score: "15:00", result: "-" },
            { date: "11 Oct 2026", opponent: "Hull City", venue: "A", score: "14:00", result: "-" },
            { date: "17 Oct 2026", opponent: "Chelsea", venue: "H", score: "12:30", result: "-" },
            { date: "24 Oct 2026", opponent: "Arsenal", venue: "A", score: "15:00", result: "-" },
            { date: "02 Nov 2026", opponent: "Newcastle United", venue: "A", score: "20:00", result: "-" },
            { date: "07 Nov 2026", opponent: "Coventry City", venue: "H", score: "15:00", result: "-" },
            { date: "21 Nov 2026", opponent: "Brentford", venue: "A", score: "15:00", result: "-" },
            { date: "28 Nov 2026", opponent: "Liverpool", venue: "H", score: "15:00", result: "-" },
            { date: "02 Dec 2026", opponent: "Aston Villa", venue: "A", score: "20:00", result: "-" },
            { date: "05 Dec 2026", opponent: "Fulham", venue: "H", score: "15:00", result: "-" },
            { date: "12 Dec 2026", opponent: "Brighton & Hove Albion", venue: "A", score: "15:00", result: "-" },
            { date: "19 Dec 2026", opponent: "Nottingham Forest", venue: "A", score: "15:00", result: "-" },
            { date: "26 Dec 2026", opponent: "Sunderland", venue: "H", score: "15:00", result: "-" },
            { date: "29 Dec 2026", opponent: "Manchester City", venue: "H", score: "20:15", result: "-" },
            { date: "01 Jan 2027", opponent: "Leeds United", venue: "A", score: "20:00", result: "-" },
            { date: "05 Jan 2027", opponent: "Aston Villa", venue: "H", score: "19:30", result: "-" },
            { date: "16 Jan 2027", opponent: "Coventry City", venue: "A", score: "15:00", result: "-" },
            { date: "23 Jan 2027", opponent: "Brentford", venue: "H", score: "15:00", result: "-" },
            { date: "30 Jan 2027", opponent: "Liverpool", venue: "A", score: "15:00", result: "-" },
            { date: "06 Feb 2027", opponent: "Newcastle United", venue: "H", score: "15:00", result: "-" },
            { date: "10 Feb 2027", opponent: "Leeds United", venue: "H", score: "20:00", result: "-" },
            { date: "20 Feb 2027", opponent: "Sunderland", venue: "A", score: "15:00", result: "-" },
            { date: "27 Feb 2027", opponent: "Nottingham Forest", venue: "H", score: "15:00", result: "-" },
            { date: "03 Mar 2027", opponent: "Manchester City", venue: "A", score: "20:00", result: "-" },
            { date: "13 Mar 2027", opponent: "Manchester United", venue: "A", score: "15:00", result: "-" },
            { date: "20 Mar 2027", opponent: "Tottenham Hotspur", venue: "H", score: "15:00", result: "-" },
            { date: "10 Apr 2027", opponent: "Crystal Palace", venue: "A", score: "15:00", result: "-" },
            { date: "17 Apr 2027", opponent: "AFC Bournemouth", venue: "H", score: "15:00", result: "-" },
            { date: "24 Apr 2027", opponent: "Brighton & Hove Albion", venue: "H", score: "15:00", result: "-" },
            { date: "01 May 2027", opponent: "Fulham", venue: "A", score: "15:00", result: "-" },
            { date: "08 May 2027", opponent: "Hull City", venue: "H", score: "15:00", result: "-" },
            { date: "15 May 2027", opponent: "Chelsea", venue: "A", score: "15:00", result: "-" },
            { date: "23 May 2027", opponent: "Arsenal", venue: "H", score: "15:00", result: "-" },
            { date: "30 May 2027", opponent: "Ipswich Town", venue: "A", score: "16:00", result: "-" }
        ];

        // --- Helper: Simple CSV Parser ---
        function parseCSV(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const oppIdx = headers.indexOf('opponent');
            const holderIdx = headers.indexOf('holder');

            if (oppIdx === -1 || holderIdx === -1) return [];

            return lines.slice(1).map(line => {
                const columns = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                return {
                    opponent: columns[oppIdx] || '',
                    holder: columns[holderIdx] || ''
                };
            });
        }

        // --- Helper: Find Holder by Opponent Name ---
        function getHolderName(opponentName, csvRecords) {
            const cleanTarget = opponentName.replace(/^(vs\s+|@\s+)/i, '').trim().toLowerCase();
            const match = csvRecords.find(row => {
                const cleanCsvOpp = row.opponent.toLowerCase().trim();
                return cleanCsvOpp === cleanTarget ||
                       cleanTarget.includes(cleanCsvOpp) ||
                       cleanCsvOpp.includes(cleanTarget);
            });
            return match ? match.holder : 'Unassigned';
        }

        // --- Render Table with Ticket Holder Conditional Logic ---
        function renderSeasonTable(csvRecords) {
            const tbody = document.getElementById('season-fixtures-body');
            tbody.innerHTML = seasonFixtures2627.map(item => {
                let badgeClass = 'badge-pending';
                if (item.result === 'W') badgeClass = 'badge-win';
                if (item.result === 'D') badgeClass = 'badge-draw';
                if (item.result === 'L') badgeClass = 'badge-loss';

                // Only lookup ticket holder if Home match (H)
                const holderValue = item.venue === 'H' 
                    ? getHolderName(item.opponent, csvRecords) 
                    : '-';

                return `
                    <tr>
                        <td>${item.date}</td>
                        <td><strong>${item.opponent}</strong></td>
                        <td><span class="venue-tag">${item.venue}</span></td>
                        <td>${item.score}</td>
                        <td><span class="badge ${badgeClass}">${item.result}</span></td>
                        <td class="ticket-holder-cell">${holderValue}</td>
                    </tr>
                `;
            }).join('');
        }

        // --- Fetch CSV & Load Data ---
        async function initDashboard() {
            let csvRecords = [];
            let currentOpponent = 'Ipswich Town';

            try {
                const response = await fetch('tickets.csv');
                if (response.ok) {
                    const csvText = await response.text();
                    csvRecords = parseCSV(csvText);
                }
            } catch (err) {
                console.warn('Unable to load tickets.csv:', err);
            }

            // Update top card ticket holder
            const holderEl = document.getElementById('val-holder');
            holderEl.textContent = getHolderName(currentOpponent, csvRecords);

            // Render table with ticket holders
            renderSeasonTable(csvRecords);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
