<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton FC Home Fixture Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Theme Variables */
        :root {
            --primary-color: #003399; /* Everton Royal Blue */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: rgba(229, 231, 235, 0.8);
            --icon-bg: rgba(0, 51, 153, 0.08);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --toggle-bg: #e5e7eb;
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --icon-bg: rgba(59, 130, 246, 0.15);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --toggle-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 28px;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--toggle-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .theme-toggle-btn:hover {
            opacity: 0.9;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        [data-theme="dark"] header h1 {
            color: #3b82f6;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-color);
        }

        [data-theme="dark"] .card::before {
            background-color: #3b82f6;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--icon-bg);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="dark"] .card-icon {
            color: #3b82f6;
        }

        .card-value {
            font-size: 1.3rem;
            font-weight: 700;
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        .status-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Light/Dark Theme">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
            <h1><i class="fa-solid fa-house"></i> Everton FC Dashboard</h1>
            <p>Next Home Premier League Fixture</p>
        </header>

        <main class="grid-container">
            <!-- Card 1: Opponent -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Opponent</span>
                    <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                </div>
                <div class="card-value" id="val-opponent">vs Ipswich Town</div>
            </div>

            <!-- Card 2: Date -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Fixture Date</span>
                    <div class="card-icon"><i class="fa-regular fa-calendar-days"></i></div>
                </div>
                <div class="card-value" id="val-date">19 Sep 2026</div>
            </div>

            <!-- Card 3: On Sale Info -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">On Sale</span>
                    <div class="card-icon"><i class="fa-solid fa-ticket"></i></div>
                </div>
                <div class="card-value" id="val-onsale">Check EvertonFC.com</div>
            </div>
        </main>

        <div class="status-footer">
            <span class="status-indicator"></span>
            <span>Next Home Fixture Loaded</span>
        </div>
    </div>

    <script>
        // Theme Switch Handler
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Light';
            } else {
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Dark';
            }
        }

        // Initialize saved or default OS theme
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme) {
            setTheme(savedTheme);
        } else if (systemPrefersDark) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // Dynamic API Fetch with Static Fallback
        const API_URL = 'https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=133615';

        async function updateDashboard() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) return;

                const data = await response.json();
                if (!data.events || data.events.length === 0) return;

                const nextHomeMatch = data.events.find(event => 
                    event.strHomeTeam && event.strHomeTeam.toLowerCase().includes('everton')
                );

                if (nextHomeMatch) {
                    document.getElementById('val-opponent').textContent = `vs ${nextHomeMatch.strAwayTeam}`;
                    if (nextHomeMatch.dateEvent) {
                        const dateObj = new Date(nextHomeMatch.dateEvent);
                        document.getElementById('val-date').textContent = dateObj.toLocaleDateString('en-GB', {
                            day: 'numeric',
                            month: 'short',
                            year: 'numeric'
                        });
                    }
                }
            } catch (e) {
                // Keep default static fallback values on CORS error
            }
        }

        document.addEventListener('DOMContentLoaded', updateDashboard);
    </script>
</body>
</html>
