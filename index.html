<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton Ticket On-Sale Dashboard</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #003399; /* Everton Royal Blue */
            --primary-light: #1a4db2;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* Responsive Breakpoints */
        @media (min-width: 640px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .card-wide {
                grid-column: span 2;
            }
        }

        @media (min-width: 850px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
            .card-wide {
                grid-column: span 1;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(229, 231, 235, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-color);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(0, 51, 153, 0.08);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .card-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        /* Loading Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 6px;
            height: 28px;
            width: 80%;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .status-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981; /* Green active status */
        }

        .status-indicator.error {
            background-color: #ef4444; /* Red error status */
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1><i class="fa-solid fa-ticket"></i> Everton FC Tickets</h1>
            <p>Next Available Fixture & Member Ballot Info</p>
        </header>

        <main class="grid-container">
            <!-- Card 1: Opponent -->
            <div class="card card-wide">
                <div class="card-header">
                    <span class="card-title">Opponent</span>
                    <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                </div>
                <div class="card-value" id="val-opponent">
                    <div class="skeleton"></div>
                </div>
            </div>

            <!-- Card 2: Date -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Fixture Date</span>
                    <div class="card-icon"><i class="fa-regular fa-calendar-days"></i></div>
                </div>
                <div class="card-value" id="val-date">
                    <div class="skeleton"></div>
                </div>
            </div>

            <!-- Card 3: On Sale -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Forever Blue+ Ballot</span>
                    <div class="card-icon"><i class="fa-solid fa-clock"></i></div>
                </div>
                <div class="card-value" id="val-onsale">
                    <div class="skeleton"></div>
                </div>
            </div>
        </main>

        <div class="status-footer">
            <span class="status-indicator" id="status-dot"></span>
            <span id="status-text">Fetching latest fixture data...</span>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://www.evertonfc.com/tickets/on-sale-dates';
        // Using allorigins proxy to bypass CORS restrictions on client-side scraping
        const PROXY_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`;

        async function fetchDashboardData() {
            const opponentEl = document.getElementById('val-opponent');
            const dateEl = document.getElementById('val-date');
            const onsaleEl = document.getElementById('val-onsale');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            try {
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                // Parse HTML string from response
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');

                // Find the main data table
                const table = doc.querySelector('table');
                if (!table) throw new Error("Could not locate on-sale dates table.");

                // Map header names to column indexes dynamically
                const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim().toLowerCase());
                
                let fixtureIdx = headers.findIndex(h => h.includes('fixture') || h.includes('match') || h.includes('opponent'));
                let dateIdx = headers.findIndex(h => h.includes('date'));
                let ballotIdx = headers.findIndex(h => h.includes('forever blue+') || h.includes('ballot') || h.includes('member'));

                // Fallbacks if header names differ slightly
                if (fixtureIdx === -1) fixtureIdx = 0;
                if (dateIdx === -1) dateIdx = 1;
                if (ballotIdx === -1) ballotIdx = 2;

                // Grab the first row from the tbody (or table body rows)
                const firstRow = table.querySelector('tbody tr') || table.querySelectorAll('tr')[1];
                if (!firstRow) throw new Error("No fixture rows found.");

                const cells = firstRow.querySelectorAll('td');

                // Extract values safely
                const opponentVal = cells[fixtureIdx]?.textContent.trim() || 'N/A';
                const dateVal = cells[dateIdx]?.textContent.trim() || 'N/A';
                const onsaleVal = cells[ballotIdx]?.textContent.trim() || 'N/A';

                // Update UI Elements
                opponentEl.textContent = opponentVal;
                dateEl.textContent = dateVal;
                onsaleEl.textContent = onsaleVal;

                statusText.textContent = `Live data updated from EvertonFC.com`;
                statusDot.classList.remove('error');

            } catch (err) {
                console.error("Scraping error:", err);
                
                // Display error states
                opponentEl.textContent = "Unable to load";
                dateEl.textContent = "Unable to load";
                onsaleEl.textContent = "Unable to load";
                
                statusText.textContent = "Failed to fetch data. CORS proxy or source unavailable.";
                statusDot.classList.add('error');
            }
        }

        // Run fetch on load
        document.addEventListener('DOMContentLoaded', fetchDashboardData);
    </script>
</body>
</html>
