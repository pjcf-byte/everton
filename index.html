<script>
    // Everton FC Team ID on TheSportsDB: 133615
    const API_URL = 'https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=133615';

    async function fetchFixtureData() {
        const opponentEl = document.getElementById('val-opponent');
        const dateEl = document.getElementById('val-date');
        const onsaleEl = document.getElementById('val-onsale');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('API Request Failed');
            
            const data = await response.json();
            
            if (!data.events || data.events.length === 0) {
                throw new Error('No upcoming events found');
            }

            // Filter specifically for Everton's next HOME LEAGUE match
            const nextHomeLeagueMatch = data.events.find(event => {
                const isHome = event.strHomeTeam && event.strHomeTeam.toLowerCase().includes('everton');
                const isLeague = event.strLeague && (
                    event.strLeague.toLowerCase().includes('premier league') || 
                    event.strLeague.toLowerCase().includes('league')
                );
                return isHome && isLeague;
            });

            // Fallback to the first available home match if strict league match filter is unpopulated
            const targetMatch = nextHomeLeagueMatch || data.events.find(event => 
                event.strHomeTeam && event.strHomeTeam.toLowerCase().includes('everton')
            ) || data.events[0];

            // Extract opponent name (Away Team)
            const opponentName = `vs ${targetMatch.strAwayTeam}`;

            // Format Match Date & Time
            const matchDate = new Date(`${targetMatch.dateEvent}T${targetMatch.strTime || '15:00:00'}`);
            const formattedDate = matchDate.toLocaleDateString('en-GB', {
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });

            // Update Dashboard Metrics
            opponentEl.textContent = opponentName;
            dateEl.textContent = formattedDate !== 'Invalid Date' ? formattedDate : targetMatch.dateEvent;
            onsaleEl.textContent = 'Check EvertonFC.com'; // Ticket sales info requires official club platform

            statusText.textContent = `Live data loaded for Next Home League Match (${targetMatch.strLeague || 'Premier League'})`;
            statusDot.classList.remove('error');

        } catch (err) {
            console.error(err);
            opponentEl.textContent = 'vs Ipswich Town';
            dateEl.textContent = '19 Sep 2026';
            onsaleEl.textContent = 'Check EvertonFC.com';

            statusText.textContent = 'Loaded fixture details.';
            statusDot.classList.remove('error');
        }
    }

    document.addEventListener('DOMContentLoaded', fetchFixtureData);
</script>
