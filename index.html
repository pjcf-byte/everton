<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everton FC Home Fixture Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #003399;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: rgba(229, 231, 235, 0.8);
            --icon-bg: rgba(0, 51, 153, 0.08);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --toggle-bg: #e5e7eb;
            --table-hover: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --icon-bg: rgba(59, 130, 246, 0.15);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --toggle-bg: #334155;
            --table-hover: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            text-align: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 28px;
            text-align: center;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--toggle-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        [data-theme="dark"] header h1 { color: #3b82f6; }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .section-header {
            margin-bottom: 12px;
            text-align: center;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (min-width: 640px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary-color);
        }

        [data-theme="dark"] .card::before { background-color: #3b82f6; }

        .card-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            width: 100%;
        }

        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--icon-bg);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="dark"] .card-icon { color: #3b82f6; }

        .card-value {
            font-size: 1.3rem;
            font-weight: 700;
            word-break: break-word;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.95rem;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        th {
            background-color: var(--icon-bg);
            color: var(--primary-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        [data-theme="dark"] th { color: #3b82f6; }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--table-hover); }

        .status-footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Light/Dark Theme">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
            <h1><i class="fa-solid fa-house"></i> Everton FC Dashboard</h1>
            <p>Home Premier League Season Schedule</p>
        </header>

        <main>
            <div class="section-header">
                <h2>Next Match Overview</h2>
            </div>

            <div class="grid-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
                        <span class="card-title">Opponent</span>
                    </div>
                    <div class="card-value" id="val-opponent">Loading...</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-regular fa-calendar-days"></i></div>
                        <span class="card-title">Fixture Date</span>
                    </div>
                    <div class="card-value" id="val-date">Loading...</div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-icon"><i class="fa-solid fa-ticket"></i></div>
                        <span class="card-title">Ticket Holder</span>
                    </div>
                    <div class="card-value" id="val-holder">Loading...</div>
                </div>
            </div>

            <div class="section-header">
                <h2>Home Fixtures & Ticket Holders</h2>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Opponent</th>
                            <th>Ticket Holder</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="home-fixtures-tbody">
                        <tr>
                            <td colspan="4">Loading full season schedule...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <div class="status-footer">
            <span class="status-indicator"></span>
            <span id="status-text">Season Home Schedule Loaded</span>
        </div>
    </div>

    <script>
        // --- Theme Switch Handler ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            themeText.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // --- Robust String Normalizer ---
        function cleanString(str) {
            return str
                .toLowerCase()
                .replace(/^(vs|@)\s+/i, '') // Remove prefix
                .replace(/fc|afc|united|city/gi, '') // Remove standard team suffixes for higher match rate
                .replace(/[^a-z0-9]/g, '') // Strips whitespace, dashes, special chars
                .trim();
        }

        // --- CSV Parser with Delimiter Handling ---
        function parseCSV(csvText) {
            const lines = csvText.trim().split(/\r?\n/);
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const oppIdx = headers.findIndex(h => h.includes('opponent') || h.includes('team'));
            const holderIdx = headers.findIndex(h => h.includes('holder') || h.includes('name'));

            if (oppIdx === -1 || holderIdx === -1) return [];

            return lines.slice(1).map(line => {
                const columns = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                return {
                    opponent: columns[oppIdx] || '',
                    holder: columns[holderIdx] || ''
                };
            }).filter(item => item.opponent.length > 0);
        }

        // --- Match Holder with Opponent ---
        function findTicketHolder(opponentName, ticketRecords) {
            if (!opponentName || !ticketRecords.length) return 'Not Assigned';

            const cleanTarget = cleanString(opponentName);

            const match = ticketRecords.find(row => {
                const cleanCsvOpponent = cleanString(row.opponent);
                return cleanTarget.includes(cleanCsvOpponent) || cleanCsvOpponent.includes(cleanTarget);
            });

            return match ? match.holder : 'Not Assigned';
        }

        // --- API Links & Data Loader ---
        const EVERTON_ID = '133615';
        
        // Season API fetches full 38-game schedule (past & future)
        const SEASON_URL = `https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=${EVERTON_ID}&s=2024-2025`;
        const NEXT_URL = `https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id=${EVERTON_ID}`;
        const LAST_URL = `https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id=${EVERTON_ID}`;

        async function initDashboard() {
            let ticketRecords = [];

            // 1. Fetch CSV
            try {
                const csvRes = await fetch('tickets.csv');
                if (csvRes.ok) {
                    const csvText = await csvRes.text();
                    ticketRecords = parseCSV(csvText);
                }
            } catch (err) {
                console.warn('tickets.csv could not be loaded directly.', err);
            }

            let allEvents = [];

            // 2. Fetch Full Season Data
            try {
                const res = await fetch(SEASON_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data.events) allEvents = data.events;
                }
            } catch (e) {
                console.warn('Season API unreachable, falling back to recent events...');
            }

            // Fallback to Next + Last if Season endpoint is empty
            if (allEvents.length === 0) {
                try {
                    const [nextRes, lastRes] = await Promise.all([fetch(NEXT_URL), fetch(LAST_URL)]);
                    if (nextRes.ok) {
                        const nData = await nextRes.json();
                        if (nData.events) allEvents.push(...nData.events);
                    }
                    if (lastRes.ok) {
                        const lData = await lastRes.json();
                        if (lData.events) allEvents.push(...lData.events);
                    }
                } catch (err) {
                    console.warn('Fallback APIs unavailable.');
                }
            }

            // 3. Filter strictly for Home Matches (Everton as Home Team)
            const homeMatches = allEvents.filter(event => 
                event.strHomeTeam && 
                event.strHomeTeam.toLowerCase().includes('everton')
            );

            // Sort chronologically
            homeMatches.sort((a, b) => new Date(a.dateEvent) - new Date(b.dateEvent));

            // 4. Update Overview Cards with the NEXT upcoming home game
            const now = new Date();
            now.setHours(0, 0, 0, 0);

            const nextHomeMatch = homeMatches.find(m => new Date(m.dateEvent) >= now) || homeMatches[homeMatches.length - 1];

            if (nextHomeMatch) {
                const oppName = nextHomeMatch.strAwayTeam || 'Unknown';
                document.getElementById('val-opponent').textContent = `vs ${oppName}`;
                
                if (nextHomeMatch.dateEvent) {
                    const dateObj = new Date(nextHomeMatch.dateEvent);
                    document.getElementById('val-date').textContent = dateObj.toLocaleDateString('en-GB', {
                        day: 'numeric', month: 'short', year: 'numeric'
                    });
                }
                document.getElementById('val-holder').textContent = findTicketHolder(oppName, ticketRecords);
            }

            // 5. Populate Table
            const tbody = document.getElementById('home-fixtures-tbody');
            tbody.innerHTML = '';

            if (homeMatches.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4">No home fixtures found. Make sure web server is running to load local tickets.csv.</td></tr>`;
                return;
            }

            homeMatches.forEach(match => {
                const tr = document.createElement('tr');
                
                const dateObj = new Date(match.dateEvent);
                const formattedDate = !isNaN(dateObj) 
                    ? dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
                    : match.dateEvent;

                let resultText = 'Upcoming';
                if (match.intHomeScore !== null && match.intHomeScore !== undefined && match.intAwayScore !== null) {
                    resultText = `${match.intHomeScore} - ${match.intAwayScore}`;
                }

                const opponent = match.strAwayTeam || 'Unknown';
                const holder = findTicketHolder(opponent, ticketRecords);

                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td>vs ${opponent}</td>
                    <td>${holder}</td>
                    <td>${resultText}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
